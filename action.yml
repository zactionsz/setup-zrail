name: Set up zrail
description: Install an exact, SHA-256-pinned zrail release
author: zsumz

inputs:
  version:
    description: Exact zrail release version
    required: true
  sha256:
    description: Expected SHA-256 digest of the archive for this runner
    required: true

outputs:
  version:
    description: Verified zrail version
  target:
    description: Selected zrail release target
  sha256:
    description: Verified lowercase archive SHA-256 digest
  path:
    description: Absolute path to the installed zrail executable
  cache-hit:
    description: Whether an existing verified tool-cache entry was used

runs:
  using: node24
  main: dist/index.js

branding:
  icon: shield
  color: gray-dark
